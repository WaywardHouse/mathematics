# Wayward House Mathematics — Chapter Front Matter Schema
# Version 0.1
#
# Every chapter .qmd file opens with a YAML block conforming to this schema.
# Fields marked [REQUIRED] must be present for the build to succeed.
# Fields marked [GENERATED] are populated automatically by scripts/build-nav.py
# Fields marked [OPTIONAL] enrich the wayfinding layer but are not blocking.
#
# The schema serves three purposes:
#   1. Authorial discipline — you cannot write the chapter until you can
#      state the rewriting rule clearly (axiom + rewrite)
#   2. Wayfinding generation — feeds the bloom visualisation and nav prose
#   3. Series integrity — ensures every chapter has a legible place in
#      the topology before a word of content is written

# ── Identity ────────────────────────────────────────────────────────────────

title: ""               # [REQUIRED] Short, plain. No "Introduction to".
subtitle: ""            # [REQUIRED] One phrase naming the core move.

volume: ~               # [REQUIRED] Integer 1–8
chapter: ~              # [REQUIRED] Integer, unique within volume
section: ""             # [OPTIONAL] For vol-07 sub-parts (odes/fourier etc.)

layer: ""               # [REQUIRED] One of:
                        #   pre-university | bridge | university | engineering | discipline
                        # Determines which ring of the bloom this sits in.

status: "seed"          # [REQUIRED] One of: seed | draft | review | final


# ── L-system grammar ────────────────────────────────────────────────────────
# These fields are AUTHORIAL ONLY. They never appear verbatim in the rendered
# chapter. They are the formal statement of the rewriting rule this chapter
# embodies. If you cannot fill these in cleanly, the chapter is not ready.

axiom: ""               # [REQUIRED] What the reader already holds coming in.
                        # One or two plain sentences. No jargon.
                        # Example: "You already know that numbers relate to
                        # each other. Some of those relationships have a gap."

rewrite: ""             # [REQUIRED] The rule that fires in this chapter.
                        # What does the reader hold differently on the way out?
                        # Example: "An equation is a relationship with a named
                        # gap. Solving it means finding what fills the gap
                        # without breaking the relationship."

opens_to:               # [REQUIRED] What this chapter makes visible.
                        # Empty list [] is valid ONLY for the genuinely terminal
                        # chapter in the series — i.e. a chapter whose topology
                        # node has no outgoing edges in _data/topology.yml.
                        # All other chapters must have at least one entry.
  - id: ""              # Chapter id. Two conventions are in use:
                        #   Vols 1–6: chapter-slug format, e.g. "v2c1-linear"
                        #   Vols 7–8 (layers engineering/discipline): topology
                        #     node id format, e.g. "estimation_inverse"
                        # Use the convention that matches the target chapter's
                        # volume. Do not mix conventions within a batch.
                        # Topology node ids as prerequisite_ids are always valid.
    label: ""           # Short human label
    volume: ~           # Integer
    relationship: ""    # One of: enables | enriches | motivates
                        #   enables   — direct prerequisite
                        #   enriches  — deepens understanding but not blocking
                        #   motivates — shows why the target chapter matters


# ── Wayfinding ──────────────────────────────────────────────────────────────

prerequisite_ids: []    # [REQUIRED] List of topology node ids from _data/topology.yml.
                        # Use the node `id` field (e.g. "linear_eq", "num", "trig") —
                        # NOT chapter-slug format (e.g. NOT "v1c1-num").
                        # Empty list is valid for Vol 1 Chapter 1 only.

destinations:           # [REQUIRED] At least one entry.
  - field: ""           # One of: eng | sci | biz | comp | geo
    label: ""           # Display name for the field
    hook: ""            # One sentence. Concrete. No "is used in".
                        # Example: "Kirchhoff's voltage law is a linear equation."
    career_example: ""  # [OPTIONAL] A specific role that uses this daily.


# ── Chapter shape ───────────────────────────────────────────────────────────

hook: ""                # [REQUIRED] The opening paragraph(s) of the chapter.
                        # Written here, rendered verbatim as the chapter lede.
                        # Terse. Real-world first. No reassurance.
                        # This is the hardest field to write. Write it last.

chapter_onramp: ~       # [OPTIONAL] true | false
                        # When axiom + rewrite are present, the build will
                        # insert a short "What this chapter helps you do"
                        # section near the top if the chapter body does not
                        # already contain one. Set to false to opt out.

notation_introduced:    # [OPTIONAL] List symbols introduced in this chapter.
  - symbol: ""          # The symbol as it appears on the page
    reads_as: ""        # How to say it in plain English
    notation_weight: ~  # Integer 1–5.
                        #   1 = needs one sentence
                        #   3 = needs a sidebar
                        #   5 = needs its own section

notation_box: ~         # [OPTIONAL] true | false
                        # When notation_introduced is present, the build will
                        # surface a short "Symbols to keep handy" callout near
                        # the top of the chapter by default.
                        # Set this to false to opt out for a specific chapter.

exercises:
  type: ""              # [REQUIRED] One of: puzzle | drill | investigation | project
                        #   puzzle      — convergent, satisfying, short
                        #   drill       — repetitive by design, builds fluency
                        #   investigation — open-ended, multiple valid answers
                        #   project     — extended, real dataset or context
  real_world_context: ~ # [REQUIRED] true | false


# ── Curriculum alignment ────────────────────────────────────────────────────
# Cross-references to external curricula and texts.
# All optional — present where known, null where not applicable.

alberta_curriculum:
  grade: ~              # Integer or null
  strand: ""
  outcome: ""

uofa_course: ""         # e.g. "MATH 100" or null for pre-university chapters

stroud_programme: ~     # Integer (1–32) or null
kreyszig_chapter: ~     # Integer (1–25) or null


