# Copy this file to waywardhouse-maths/.github/workflows/publish.yml
#
# Requires secret: WAYWARD_PUBLISH_TOKEN (same PAT used in waywardhouse-site)
# The PAT needs write access to waywardhouse/waywardhouse.github.io
#
# Output dir in _quarto.yml must be: _site
# Target URL will be: wayward.house/learn/maths/core/

name: Publish Maths Book
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
       
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        uses: quarto-dev/quarto-actions/render@v2

      - name: Deploy to waywardhouse.github.io/learn/maths/core
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2
        env:
          API_TOKEN_GITHUB: ${{ secrets.WAYWARD_PUBLISH_TOKEN }}
        with:
          source-directory: '_site'
          destination-github-username: 'waywardhouse'
          destination-repository-name: 'waywardhouse.github.io'
          target-directory: 'learn/maths/core'
          user-email: github-actions@github.com
          target-branch: main
          # Protect the main site and other books from being overwritten
          arguments: --exclude=articles/ --exclude=learn/computational-geography/ --exclude=assets/ --exclude=CNAME
