project:
  type: book
  output-dir: _site
  resources:
    - _data/
    - assets/

filters:
  - filters/chapter-onramp.lua
  - filters/definitions-box.lua
  - filters/notation-box.lua

book:
  title: "Wayward House Mathematics"
  subtitle: "A series for people who want to understand, not just pass"
  date: last-modified
  search: true
  page-navigation: false
  repo-url: https://github.com/wayward-house/mathematics
  repo-actions: [edit, issue]
  sharing: [twitter, linkedin]
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    tools:
      - icon: house
        href: /
        aria-label: Wayward House
      - icon: grid
        href: /learn/
        aria-label: Learn
      - icon: github
        href: https://github.com/wayward-house/mathematics
        aria-label: Repository
  page-footer:
    left: |
      **WaywardHouse.**
      Understanding how place, economy, and environment interact through analysis, modelling, and open tools.
    center: |
      **Reading**

      [Articles](/articles/)

      [Learn](/learn/)

      [Archive](/archive.html)
    right: |
      **Resources**

      [Choose Your Path](https://wayward.house/start-here.html)

      [Privacy](https://wayward.house/privacy.html)

      [Terms](https://wayward.house/terms.html)

  chapters:
    - index.qmd
    - map/how-to-use.qmd
    - part: "Volume 1 — Numbers and operations"
      number-offset: 0
      chapters:
        - vol-01/index.qmd
        - vol-01/01-number-line.qmd
        - vol-01/02-ratio-proportion.qmd
        - vol-01/03-percent-rates.qmd
        - vol-01/04-integers.qmd
        - vol-01/05-fractions-decimals.qmd
        - vol-01/06-statistics-probability.qmd
    - part: "Volume 2 — Patterns and algebra"
      number-offset: 9
      chapters:
        - vol-02/index.qmd
        - vol-02/01-linear-equations.qmd
        - vol-02/02-inequalities.qmd
        - vol-02/03-patterns-sequences.qmd
        - vol-02/04-graphing-relations.qmd
    - part: "Volume 3 — Shape and measure"
      number-offset: 14
      chapters:
        - vol-03/index.qmd
        - vol-03/01-geometry-measurement.qmd
        - vol-03/02-trigonometry.qmd
        - vol-03/03-polynomials-factoring.qmd
        - vol-03/04-functions-relations.qmd
    - part: "Volume 4 — Functions and change"
      number-offset: 19
      chapters:
        - vol-04/index.qmd
        - vol-04/01-exponents-logarithms.qmd
        - vol-04/02-complex-numbers.qmd
        - vol-04/03-systems-matrices.qmd
        - vol-04/04-sequences-series.qmd
    - part: "Volume 5 — Analysis and proof"
      number-offset: 04
      chapters:
        - vol-05/index.qmd
        - vol-05/01-limits-continuity.qmd
        - vol-05/02-differential-calculus.qmd
        - vol-05/03-integral-calculus.qmd
        - vol-05/04-proof-reasoning.qmd
    - part: "Volume 6 — Probability and data"
      number-offset: 09
      chapters:
        - vol-06/index.qmd
        - vol-06/01-probability-theory.qmd
        - vol-06/02-distributions.qmd
        - vol-06/03-statistical-inference.qmd
        - vol-06/04-data-analysis.qmd
    - part: "Volume 7 — Engineering mathematics: ODEs"
      number-offset: 34
      chapters:
        - vol-07/index.qmd
        - vol-07/odes/01-first-order.qmd
        - vol-07/odes/02-second-order.qmd
        - vol-07/odes/03-systems-phase-plane.qmd
        - vol-07/odes/04-laplace-transforms.qmd
    - part: "Volume 7 — Linear algebra and vector calculus"
      number-offset: 39
      chapters:
        - vol-07/linear-algebra/01-matrices-systems.qmd
        - vol-07/linear-algebra/02-eigenvalues.qmd
        - vol-07/linear-algebra/03-vector-differential.qmd
        - vol-07/linear-algebra/04-vector-integral.qmd
    - part: "Volume 7 — Fourier analysis and PDEs"
      number-offset: 43
      chapters:
        - vol-07/fourier-pdes/01-fourier-series.qmd
        - vol-07/fourier-pdes/02-fourier-transforms.qmd
        - vol-07/fourier-pdes/03-partial-differential-equations.qmd
    - part: "Volume 7 — Complex analysis"
      number-offset: 46
      chapters:
        - vol-07/complex-analysis/01-complex-functions.qmd
        - vol-07/complex-analysis/02-complex-integration.qmd
        - vol-07/complex-analysis/03-series-residues.qmd
        - vol-07/complex-analysis/04-conformal-mapping.qmd
    - part: "Volume 7 — Numerical methods"
      number-offset: 50
      chapters:
        - vol-07/numerics/01-numerical-methods.qmd
        - vol-07/numerics/02-numerical-linear-algebra.qmd
        - vol-07/numerics/03-numerical-odes-pdes.qmd
    - part: "Volume 7 — Optimisation and probability"
      number-offset: 53
      chapters:
        - vol-07/optimisation/01-linear-programming.qmd
        - vol-07/optimisation/02-graphs-networks.qmd
        - vol-07/probability/01-probability-theory.qmd
        - vol-07/probability/02-mathematical-statistics.qmd
    - part: "Volume 8 — Upper-year engineering mathematics"
      number-offset: 57
      chapters:
        - vol-08/index.qmd
        - vol-08/01-control-feedback.qmd
        - vol-08/02-discrete-systems-signals.qmd
        - vol-08/03-continuum-transport.qmd
        - vol-08/04-computational-methods.qmd
        - vol-08/05-estimation-inverse.qmd
        - vol-08/06-reliability-stochastic.qmd
        - vol-08/07-nonlinear-optimisation.qmd

format:
  html:
    css: _extensions/wayward-book/wayward-book.css
    include-in-header: _extensions/wayward-book/head.html
    smooth-scroll: true
    toc: true
    toc-depth: 3
    number-sections: true
    fig-align: center
    callout-appearance: simple
    code-fold: true

execute:
  freeze: auto
  echo: false
  warning: false
